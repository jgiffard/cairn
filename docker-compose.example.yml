# ---------------------------------------------------------------------------
# Cairn — example deployment.
#
# Copy to docker-compose.yml (or docker-compose.override.yml, which is
# gitignored) and adjust. Nothing host-specific belongs in this file.
#
# Assumes a Traefik instance already running on an external Docker network
# with a Let's Encrypt certificate resolver. Adapt the labels for nginx or
# Caddy if you use those instead.
#
# Required environment:
#   CAIRN_DOMAIN         hostname to serve on, e.g. cairn.example.com
#   CAIRN_PROXY_NETWORK  existing external Docker network your proxy is on
# ---------------------------------------------------------------------------

services:
  migrate:
    profiles: [tools]
    build:
      context: .
      target: migrator
    env_file:
      - .env.local
    networks:
      - database

  cairn:
    build:
      context: .
      target: runner
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: cairn
    restart: unless-stopped

    # Secrets come from a gitignored env file, never from this compose file.
    env_file:
      - .env.local

    expose:
      - '3000'

    # Hardening: the app needs no write access to its own filesystem.
    user: 'nextjs'
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # The only path the app writes to. It must be owned by uid 1001 (the
      # `nextjs` user above) BEFORE the first start:
      #   sudo mkdir -p /srv/cairn/attachments
      #   sudo chown -R 1001:1001 /srv/cairn/attachments
      # A root-owned directory here is readable, so the app boots and reports
      # healthy; it fails only later, when someone attaches a file and the
      # per-project mkdir returns EACCES.
      - /srv/cairn/attachments:/data/attachments
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - proxy
      - database

    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=${CAIRN_PROXY_NETWORK}'
      - 'traefik.http.routers.cairn.rule=Host(`${CAIRN_DOMAIN}`)'
      - 'traefik.http.routers.cairn.entrypoints=websecure'
      - 'traefik.http.routers.cairn.tls.certresolver=letsencrypt'
      - 'traefik.http.services.cairn.loadbalancer.server.port=3000'
      - 'traefik.http.routers.cairn.middlewares=cairn-headers'
      - 'traefik.http.middlewares.cairn-headers.headers.stsSeconds=31536000'
      - 'traefik.http.middlewares.cairn-headers.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.cairn-headers.headers.stsPreload=true'
      - 'traefik.http.middlewares.cairn-headers.headers.frameDeny=true'
      - 'traefik.http.middlewares.cairn-headers.headers.contentTypeNosniff=true'

networks:
  proxy:
    name: ${CAIRN_PROXY_NETWORK}
    external: true
  database:
    name: ${CAIRN_DATABASE_NETWORK:-cairn-data}
    external: true
