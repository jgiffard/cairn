name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test
        env:
          # Names that must not appear in a public repository, and therefore
          # cannot be listed in one. Optional: unset, the guard that reads it
          # passes vacuously and the shape checks still run.
          CAIRN_PRIVATE_TERMS: ${{ secrets.CAIRN_PRIVATE_TERMS }}

      - name: build
        # Nothing to inject: the build reaches no database, and the Supabase
        # placeholders that used to sit here were read by nothing once the
        # runtime moved to the native PostgreSQL driver.
        run: npm run build

      - name: agent guide stays within budget
        run: |
          bytes=$(wc -c < AGENTS.md)
          echo "AGENTS.md is $bytes bytes"
          if [ "$bytes" -gt 8192 ]; then
            echo "::error::AGENTS.md exceeds 8KB — agents read this on every session."
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cairn
          POSTGRES_DB: cairn_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cairn@127.0.0.1:5432/cairn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: migrate clean PostgreSQL
        run: npm run db:migrate
      - name: blocking integrity integration suite
        run: npm run test:integration
